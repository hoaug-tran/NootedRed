name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build NootedRed
    runs-on: macos-latest
    permissions:
      contents: write
      discussions: write
    env:
      AppleForgePath: ${{ github.workspace }}/AppleForge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone AppleForge build system
        run: |
          git clone --depth 1 --recurse-submodules https://git.chefkiss.dev/AppleHax/AppleForge.git

      - name: Install xmake
        run: |
          brew install xmake

      - name: Build Debug
        run: |
          xmake f -m debug -a x86_64 -y && xmake -y

      - name: Build ReleaseDbg
        run: |
          xmake f -m releasedbg -a x86_64 -y && xmake -y

      - name: Build Release
        run: |
          xmake f -m release -a x86_64 -y && xmake -y

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NootedRed-Artifacts
          path: |
            build/**/*.zip
            build/**/NootedRed.kext
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s nullglob
          files=(build/**/*.zip)
          [ ${#files[@]} -gt 0 ] || { echo "No zip files found"; exit 1; }

          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="${{ github.ref_name }}" '
              $0 ~ "^## " ver "([[:space:]]|$)" {flag=1; next}
              /^## / {flag=0}
              flag
            ' CHANGELOG.md | sed 's/^### /## /' || true)
          fi

          if [ -n "$NOTES" ]; then
            echo "$NOTES" | gh release create "${{ github.ref_name }}" "${files[@]}" \
              -t "${{ github.ref_name }}" \
              --verify-tag \
              -F -
          else
            gh release create "${{ github.ref_name }}" "${files[@]}" \
              -t "${{ github.ref_name }}" \
              --verify-tag \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
